name: deprecate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate the old scoped package
        run: npm deprecate "@limbo1996/dshsync" "Renamed to dsh-config-transfer. Install dsh-config-transfer instead."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
