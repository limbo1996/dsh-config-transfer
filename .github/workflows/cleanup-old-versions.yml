name: cleanup-old-versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate superseded versions
        run: |
          set +e
          npm deprecate dsh-config-transfer@1.0.0 "Superseded by 1.0.2; old dshsync branding. Use dsh-config-transfer@1.0.2."
          npm deprecate dsh-config-transfer@1.0.1 "Superseded by 1.0.2; old dshsync branding. Use dsh-config-transfer@1.0.2."
          npm deprecate dsh-config-transfer@0.0.0-stage "Superseded by 1.0.2."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
